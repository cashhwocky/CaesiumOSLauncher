name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Generate Scaffold & Build APK
        run: |
          mkdir -p /tmp/backup/lib
          cp lib/main.dart /tmp/backup/lib/
          cp pubspec.yaml /tmp/backup/

          rm -rf lib android ios web linux macos windows pubspec.yaml .metadata

          flutter create . --org com.example --project-name caesium_launcher --platforms=android

          cp /tmp/backup/lib/main.dart lib/
          cp /tmp/backup/pubspec.yaml pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
